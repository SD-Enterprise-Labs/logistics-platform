server:
  port: ${PORT:8081}

spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipments}
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD:logistics}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
